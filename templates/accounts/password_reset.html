{% extends 'accounts/login.html' %}
{% block title %}Reset password — Delight Care Plus{% endblock %}
{% block form %}
<h1 class="h2">Forgot your password? 🔑</h1>
<p class="text-2">Enter your email and we'll send you a link to choose a new one.</p>
<form method="post" class="mt-3">
    {% csrf_token %}
    <div class="field"><label for="e">Email</label><input id="e" type="email" name="email" autocomplete="email" autofocus required></div>
    <button class="btn-glow btn-block" type="submit">Send reset link</button>
</form>
<p class="text-2 mt-4 mb-0"><a href="{% url 'accounts:login' %}">Back to log in</a></p>
{% endblock %}
